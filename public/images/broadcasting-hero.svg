<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="100%" height="100%">
  <defs>
    <!-- Sky to Bright Blue Gradients -->
    <linearGradient id="hero-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1685FF" />
      <stop offset="60%" stop-color="#0057D9" />
      <stop offset="100%" stop-color="#0047AB" />
    </linearGradient>

    <linearGradient id="mic-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A85FF" />
      <stop offset="40%" stop-color="#0057D9" />
      <stop offset="100%" stop-color="#092653" />
    </linearGradient>

    <linearGradient id="globe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF5FF" />
      <stop offset="100%" stop-color="#64C7FF" />
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <linearGradient id="red-live" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4155" />
      <stop offset="100%" stop-color="#FF3045" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="soft-blue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0047AB" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Wave Backdrop -->
  <path d="M 40 400 C 160 320, 240 440, 480 340 C 400 240, 460 120, 360 80 C 260 40, 120 180, 40 400 Z"
        fill="#EAF5FF" opacity="0.6" />

  <path d="M 120 420 C 220 340, 300 420, 500 320 C 440 240, 480 160, 400 130 C 320 100, 200 220, 120 420 Z"
        fill="url(#hero-blue-grad)" opacity="0.12" />

  <!-- Radio Waves Broadcasting Rings -->
  <g stroke="#1685FF" fill="none" opacity="0.35" stroke-linecap="round">
    <circle cx="360" cy="210" r="130" stroke-width="2.5" stroke-dasharray="8 6" />
    <circle cx="360" cy="210" r="165" stroke-width="2" opacity="0.5" />
    <circle cx="360" cy="210" r="200" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.3" />
  </g>

  <!-- Stylized Earth Globe in Background -->
  <g transform="translate(260, 100)" opacity="0.4">
    <circle cx="100" cy="100" r="90" fill="url(#globe-grad)" opacity="0.7" />
    <ellipse cx="100" cy="100" rx="90" ry="32" fill="none" stroke="#1685FF" stroke-width="1.8" />
    <ellipse cx="100" cy="100" rx="90" ry="65" fill="none" stroke="#1685FF" stroke-width="1.8" />
    <line x1="10" y1="100" x2="190" y2="100" stroke="#1685FF" stroke-width="1.8" />
    <ellipse cx="100" cy="100" rx="42" ry="90" fill="none" stroke="#1685FF" stroke-width="1.8" />
  </g>

  <!-- Broadcast Radio Waves Arc (Left of Mic) -->
  <g stroke="#1685FF" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M 270 170 A 55 55 0 0 0 270 250" />
    <path d="M 250 150 A 85 85 0 0 0 250 270" opacity="0.65" />
    <path d="M 230 130 A 115 115 0 0 0 230 290" opacity="0.35" />
  </g>

  <!-- Professional Broadcast Studio Microphone -->
  <g id="studio-microphone" transform="translate(360, 230)">
    <!-- Shock Mount Outer Metal Ring -->
    <circle cx="0" cy="20" r="88" fill="none" stroke="#0047AB" stroke-width="6" opacity="0.25" />
    <circle cx="0" cy="20" r="82" fill="none" stroke="#092653" stroke-width="4.5" />
    
    <!-- Shock Mount Elastic Straps -->
    <line x1="-75" y1="-15" x2="-35" y2="10" stroke="#1685FF" stroke-width="2.5" />
    <line x1="75" y1="-15" x2="35" y2="10" stroke="#1685FF" stroke-width="2.5" />
    <line x1="-75" y1="55" x2="-35" y2="30" stroke="#1685FF" stroke-width="2.5" />
    <line x1="75" y1="55" x2="35" y2="30" stroke="#1685FF" stroke-width="2.5" />

    <!-- Mic Stand Arm / Base -->
    <rect x="-8" y="95" width="16" height="70" rx="6" fill="#092653" />
    <path d="M -30 160 L 30 160 L 45 175 L -45 175 Z" fill="#0047AB" />
    <ellipse cx="0" cy="175" rx="55" ry="14" fill="#092653" />

    <!-- Microphone Body (Sleek Royal/Bright Blue) -->
    <!-- Lower Barrel -->
    <rect x="-34" y="0" width="68" height="75" rx="8" fill="url(#mic-body-grad)" filter="url(#badge-shadow)" />
    <!-- Metallic Band -->
    <rect x="-35" y="0" width="70" height="7" fill="#EAF5FF" opacity="0.8" />
    
    <!-- Microphone Pop Filter / Capsule Head (Dark Navy & Blue Mesh) -->
    <rect x="-38" y="-95" width="76" height="96" rx="38" fill="#1685FF" />
    <!-- Mesh Texture Pattern Overlay -->
    <path d="M -38 -55 Q 0 -62 38 -55 M -38 -35 Q 0 -42 38 -35 M -38 -15 Q 0 -22 38 -15" 
          stroke="#0047AB" stroke-width="2.5" fill="none" opacity="0.4" />
    <line x1="-20" y1="-92" x2="-20" y2="0" stroke="#0047AB" stroke-width="2" opacity="0.3" />
    <line x1="0" y1="-95" x2="0" y2="0" stroke="#EAF5FF" stroke-width="2.5" opacity="0.5" />
    <line x1="20" y1="-92" x2="20" y2="0" stroke="#0047AB" stroke-width="2" opacity="0.3" />

    <!-- ON AIR Glowing Red Badge on Microphone -->
    <rect x="-38" y="14" width="76" height="26" rx="6" fill="url(#red-live)" filter="url(#badge-shadow)" />
    <text x="0" y="32" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" letter-spacing="1.5" text-anchor="middle">
      ON AIR
    </text>
  </g>

  <!-- Floating Feature Badge: "News • Radio • TV • 24/7" -->
  <g transform="translate(410, 50)" filter="url(#badge-shadow)">
    <rect x="-5" y="0" width="105" height="75" rx="16" fill="#FFFFFF" stroke="#D5E7FA" stroke-width="2" />
    <text x="47" y="24" fill="#0057D9" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" text-anchor="middle">NEWS</text>
    <text x="47" y="42" fill="#1685FF" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" text-anchor="middle">RADIO</text>
    <text x="47" y="60" fill="#FF3045" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" text-anchor="middle">TV 24/7</text>
  </g>

  <!-- Decorative Blue Swirl Wave Ribbon -->
  <path d="M 220 370 Q 320 320 460 380 Q 490 395 510 420 Q 360 410 240 430 Z"
        fill="url(#hero-blue-grad)" opacity="0.9" filter="url(#badge-shadow)" />
  <path d="M 260 395 Q 350 350 490 410" stroke="#64C7FF" stroke-width="3" fill="none" opacity="0.75" />

  <!-- Tiny Glowing Sparkles -->
  <circle cx="160" cy="90" r="4" fill="#1685FF" opacity="0.6" />
  <circle cx="210" cy="60" r="2.5" fill="#64C7FF" opacity="0.8" />
  <circle cx="480" cy="180" r="3.5" fill="#0057D9" opacity="0.5" />
</svg>
