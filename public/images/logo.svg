<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Royal Blue Gradient -->
    <linearGradient id="logo-blue-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1685FF" />
      <stop offset="45%" stop-color="#0057D9" />
      <stop offset="100%" stop-color="#0047AB" />
    </linearGradient>

    <!-- Golden Yellow Gradient -->
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="40%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- Sky Blue Waves Gradient -->
    <linearGradient id="logo-sky-waves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#64C7FF" />
      <stop offset="100%" stop-color="#1685FF" />
    </linearGradient>

    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0047AB" flood-opacity="0.35" />
    </filter>

    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Shadow / Accent -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#D5E7FA" stroke-width="4" opacity="0.6" />
  
  <!-- Main Circular Badge -->
  <circle cx="250" cy="250" r="225" fill="url(#logo-blue-bg)" filter="url(#logo-shadow)" stroke="#64C7FF" stroke-width="3.5" />
  
  <!-- Subtle Inner Border -->
  <circle cx="250" cy="250" r="212" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4" />

  <!-- Radio Transmission Waves (Left and Right) -->
  <g stroke="url(#logo-sky-waves)" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.95">
    <!-- Left Waves -->
    <path d="M 180 190 A 75 75 0 0 0 180 310" />
    <path d="M 150 160 A 115 115 0 0 0 150 340" opacity="0.75" />
    <path d="M 120 130 A 155 155 0 0 0 120 370" opacity="0.45" />

    <!-- Right Waves -->
    <path d="M 320 190 A 75 75 0 0 1 320 310" />
    <path d="M 350 160 A 115 115 0 0 1 350 340" opacity="0.75" />
    <path d="M 380 130 A 155 155 0 0 1 380 370" opacity="0.45" />
  </g>

  <!-- Golden Crescent Moon (Symbol of Arab Heritage) -->
  <path d="M 285 145 C 225 145 178 195 178 255 C 178 315 225 365 285 365 C 260 338 248 300 248 255 C 248 210 260 172 285 145 Z"
        fill="url(#logo-gold)" filter="url(#gold-glow)" />

  <!-- Central Broadcasting Tower Mast -->
  <g id="tower">
    <line x1="250" y1="135" x2="250" y2="350" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />
    <line x1="225" y1="225" x2="275" y2="225" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="215" y1="265" x2="285" y2="265" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <line x1="205" y1="305" x2="295" y2="305" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />

    <!-- Glowing Top Beacon -->
    <circle cx="250" cy="125" r="14" fill="url(#logo-gold)" filter="url(#gold-glow)" />
    <circle cx="250" cy="125" r="6" fill="#FFFFFF" />
  </g>

  <!-- Station Banner Pill at Bottom: ARAB HAUSA -->
  <g transform="translate(145, 385)">
    <rect x="0" y="0" width="210" height="42" rx="21" fill="#092653" stroke="url(#logo-gold)" stroke-width="2" />
    <text x="105" y="27" fill="url(#logo-gold)" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="17" letter-spacing="3" text-anchor="middle">
      ARAB HAUSA
    </text>
  </g>
</svg>
